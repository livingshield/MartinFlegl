<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Povinné Ručení - AutoSafe PoP | Rychle a Spolehlivě</title>
    <meta name="description" content="Sjednejte si povinné ručení online přes mobil. Rychlý formulář, okamžitá kalkulace.">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png?v=20260723_1">
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=20260723_1">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260723_1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Confetti & VanillaTilt CDN for WOW Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
</head>
<body>
    <canvas id="particlesCanvas"></canvas>

    <div class="background-elements">
        <div class="glow-circle blue"></div>
        <div class="glow-circle green"></div>
    </div>

    <main class="container">
        <header class="app-header wow-fadeInDown">
            <div class="logo">
                <img src="logo.png" alt="FFG Financial Group" class="logo-img">
            </div>
            <div class="badge-title" data-editable="ffg.badge">AUTOSAFE PoP</div>
            <h1 data-editable="ffg.title">Sjednání povinného ručení</h1>
            <p data-editable="ffg.subtitle">Vyplňte základní údaje pro nezávaznou nabídku a okamžitou kalkulaci.</p>
        </header>

        <div class="app-content centered">
            <section class="form-section glass-panel wow-tilt" data-tilt data-tilt-max="6" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.15">
                <form id="insuranceForm">
                    <h2 class="section-title" data-editable="ffg.section1.title">
                        <span class="icon">🚗</span> Údaje o vozidle
                    </h2>
                    <div class="form-group wow-input-group">
                        <label for="spz" data-editable="ffg.label.spz">SPZ nebo VIN vozidla</label>
                        <div class="input-wrapper">
                            <input type="text" id="spz" name="spz" required placeholder="Např. 1AB 2345 nebo VIN" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" autocomplete="off">
                            <span class="focus-glow"></span>
                        </div>
                    </div>
                    <div class="form-group wow-input-group">
                        <label for="brand" data-editable="ffg.label.brand">Značka a model vozidla</label>
                        <div class="input-wrapper">
                            <input type="text" id="brand" name="brand" required placeholder="Např. Škoda Octavia 2.0 TDI" autocapitalize="words" autocorrect="off" autocomplete="off">
                            <span class="focus-glow"></span>
                        </div>
                    </div>

                    <h2 class="section-title" data-editable="ffg.section2.title">
                        <span class="icon">👤</span> Údaje o pojistníkovi
                    </h2>
                    <div class="form-group wow-input-group">
                        <label for="fullname" data-editable="ffg.label.fullname">Jméno a příjmení / Název firmy</label>
                        <div class="input-wrapper">
                            <input type="text" id="fullname" name="fullname" required placeholder="Jan Novák" autocomplete="name" autocapitalize="words">
                            <span class="focus-glow"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group half wow-input-group">
                            <label for="idNumber" data-editable="ffg.label.idnumber">Datum narození / IČO</label>
                            <div class="input-wrapper">
                                <input type="text" id="idNumber" name="idNumber" required placeholder="DD.MM.RRRR nebo IČO" inputmode="text" autocomplete="off">
                                <span class="focus-glow"></span>
                            </div>
                        </div>
                        <div class="form-group half wow-input-group">
                            <label for="zipCode" data-editable="ffg.label.zipcode">PSČ</label>
                            <div class="input-wrapper">
                                <input type="text" id="zipCode" name="zipCode" required placeholder="120 00" inputmode="numeric" pattern="[0-9]*" autocomplete="postal-code">
                                <span class="focus-glow"></span>
                            </div>
                        </div>
                    </div>

                    <h2 class="section-title" data-editable="ffg.section3.title">
                        <span class="icon">📞</span> Kontaktní údaje
                    </h2>
                    <div class="form-row">
                        <div class="form-group half wow-input-group">
                            <label for="email" data-editable="ffg.label.email">E-mail</label>
                            <div class="input-wrapper">
                                <input type="email" id="email" name="email" required placeholder="jan.novak@email.cz" inputmode="email" autocomplete="email">
                                <span class="focus-glow"></span>
                            </div>
                        </div>
                        <div class="form-group half wow-input-group">
                            <label for="phone" data-editable="ffg.label.phone">Telefon</label>
                            <div class="input-wrapper">
                                <input type="tel" id="phone" name="phone" required placeholder="+420 123 456 789" inputmode="tel" autocomplete="tel">
                                <span class="focus-glow"></span>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary wow-btn" id="submitBtn">
                            <span class="btn-text" data-editable="ffg.submit.text">Odeslat poptávku ✨</span>
                            <div class="loader hidden"></div>
                        </button>
                    </div>
                    <div id="formMessage" class="message hidden"></div>
                </form>
            </section>
        </div>

        <footer class="app-footer">
            <a href="qr.html" class="qr-link" data-editable="ffg.footer.qrlink">QR kód na tuto stránku &rarr;</a>
            <div style="margin-top: 15px;">
                <button id="admin-login-trigger" class="admin-login-btn" title="Administrace webu (Klávesová zkratka: Ctrl + Shift + L)">🔐 Administrace</button>
            </div>
        </footer>
    </main>

    <!-- Admin Modal -->
    <div id="admin-modal" class="admin-modal-overlay" style="display: none;">
        <div class="admin-modal-card">
            <button class="admin-modal-close" id="admin-modal-close">&times;</button>
            <h3>Administrace webu</h3>
            <p class="admin-modal-subtitle">Přihlášení pro správu obsahu</p>
            <form id="admin-login-form">
                <div class="admin-form-group">
                    <label for="admin-user">Uživatelské jméno</label>
                    <input type="text" id="admin-user" required placeholder="např. martinf" autocomplete="username">
                </div>
                <div class="admin-form-group">
                    <label for="admin-pass">Heslo</label>
                    <input type="password" id="admin-pass" required placeholder="Vaše heslo" autocomplete="current-password">
                </div>
                <div id="admin-login-error" class="admin-error-msg" style="display: none;"></div>
                <button type="submit" class="btn-primary" style="margin-top: 10px; min-height: 46px;">Přihlásit se</button>
            </form>
        </div>
    </div>

    <!-- Admin Floating Toolbar -->
    <div id="admin-toolbar" class="admin-toolbar" style="display: none;">
        <div class="admin-toolbar-content">
            <div class="admin-status">
                <span class="admin-badge">ADMIN MODE</span>
                <span id="admin-username-display">Přihlášen: Admin</span>
                <span id="admin-unsaved-count" class="unsaved-pill" style="display: none;">0 neuložených změn</span>
            </div>
            <div class="admin-actions">
                <button id="admin-save-btn" class="btn-admin-save" disabled>💾 Uložit změny</button>
                <button id="admin-logout-btn" class="btn-admin-logout">❌ Odhlásit</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>

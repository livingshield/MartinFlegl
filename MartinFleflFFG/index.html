<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Povinné Ručení - Rychle a Spolehlivě</title>
    <meta name="description" content="Sjednejte si povinné ručení online. Rychlý formulář, okamžitá kalkulace.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-elements">
        <div class="glow-circle blue"></div>
        <div class="glow-circle green"></div>
    </div>

    <main class="container">
        <header class="app-header">
            <div class="logo">
                <img src="logo.png" alt="FFG Financial Group" class="logo-img">
            </div>
            <h1>Sjednání povinného ručení</h1>
            <p>Vyplňte základní údaje pro nezávaznou nabídku a okamžitou kalkulaci.</p>
        </header>

        <div class="app-content centered">
            <section class="form-section glass-panel">
                <form id="insuranceForm">
                    <h2 class="section-title">Údaje o vozidle</h2>
                    <div class="form-group">
                        <label for="spz">SPZ nebo VIN</label>
                        <input type="text" id="spz" name="spz" required placeholder="Např. 1AB 2345">
                    </div>
                    <div class="form-group">
                        <label for="brand">Značka a model vozidla</label>
                        <input type="text" id="brand" name="brand" required placeholder="Např. Škoda Octavia">
                    </div>

                    <h2 class="section-title">Údaje o pojistníkovi</h2>
                    <div class="form-group">
                        <label for="fullname">Jméno a příjmení / Název firmy</label>
                        <input type="text" id="fullname" name="fullname" required placeholder="Jan Novák">
                    </div>
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="idNumber">Rodné číslo / IČO</label>
                            <input type="text" id="idNumber" name="idNumber" required placeholder="RRMMDD/XXXX">
                        </div>
                        <div class="form-group half">
                            <label for="zipCode">PSČ</label>
                            <input type="text" id="zipCode" name="zipCode" required placeholder="120 00">
                        </div>
                    </div>

                    <h2 class="section-title">Kontaktní údaje</h2>
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" required placeholder="jan.novak@email.cz">
                        </div>
                        <div class="form-group half">
                            <label for="phone">Telefon</label>
                            <input type="tel" id="phone" name="phone" required placeholder="+420 123 456 789">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="submitBtn">
                            <span class="btn-text">Odeslat poptávku</span>
                            <div class="loader hidden"></div>
                        </button>
                    </div>
                    <div id="formMessage" class="message hidden"></div>
                </form>
            </section>
        </div>

        <footer class="app-footer">
            <a href="qr.html" class="qr-link">Vytisknout QR kód pro klienty &rarr;</a>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
